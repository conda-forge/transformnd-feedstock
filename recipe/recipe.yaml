context:
  version: "0.9.2"
  build_number: 0
  python_min: "3.12"

package:
  name: transformnd
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/56/06/603ac1661eb4c65018901ec4bf8af4159bde8a14100848b151c889509f05/transformnd-${{ version }}.tar.gz
    sha256: d6e37eb810a1173ede1d98221fd29b5df26717866fb02446d2b91c6ccf4b0dfc

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.12.10,<0.13.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - networkx >=3
    - array-api-compat >=1.14
    - typing-extensions >=4.15.0

tests:
  - python:
      imports:
        - transformnd
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: ND coordinate transformations
  description: |
    A library providing a general API for coordinate transformations,
    as well as some common transform implementations.
    The goal is to allow downstream applications which require such transformations
    (e.g. image registration) to be generic over anything inheriting from `transformnd.Transform`.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/transformnd
  repository: https://github.com/clbarnes/transformnd
  documentation: https://transformnd.readthedocs.io/

extra:
  recipe-maintainers:
    - clbarnes
