context:
  version: "0.9.1"
  build_number: 0
  python_min: "3.12"

package:
  name: transformnd
  version: ${{ version }}

source:
  - url: https://files.pythonhosted.org/packages/7d/28/0e039cf912d31c03befd47cb1987fcd76ddeedd9943765fdd47f0b5aa016/transformnd-${{ version }}.tar.gz
    sha256: f87b9f599b85bcfb4f82d5e1cbedfc915bd72abb3ae478c08cc7882fc700df36

build:
  number: ${{ build_number }}
  script: ${{ PYTHON }} -m pip install .
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - uv-build >=0.12.10,<0.13.0
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=2
    - networkx >=3
    - array-api-compat >=1.14
    - typing-extensions >=4.15.0

tests:
  - python:
      imports:
        - transformnd
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: ND coordinate transformations
  description: |
    A library providing a general API for coordinate transformations,
    as well as some common transform implementations.
    The goal is to allow downstream applications which require such transformations
    (e.g. image registration) to be generic over anything inheriting from `transformnd.Transform`.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/transformnd
  repository: https://github.com/clbarnes/transformnd
  documentation: https://transformnd.readthedocs.io/

extra:
  recipe-maintainers:
    - clbarnes
